name: Publicar página

on:
  push:
    branches: [main]
    paths: ['index.html', '.github/workflows/publicar-pagina.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar site
        env:
          HF_REPO: ${{ vars.HF_REPO }}
        run: |
          mkdir _site
          sed "s#__HF_REPO__#${HF_REPO}#" index.html > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
